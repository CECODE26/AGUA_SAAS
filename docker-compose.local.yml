# Agua Elite en tu computadora, sin chocar con otros proyectos (p. ej. AGUAPAG).
# Úsalo con:  sh scripts/levantar-local.sh   (elige un puerto libre y crea .env.local-docker)
# Solo publica UN puerto (la web); la API y la base quedan dentro de Docker.
# Los valores salen de .env.local-docker (ignorado por git), nunca de este archivo.
name: agua-elite-local

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agua_elite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/agua_elite
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      PLATAFORMA_DOMINIO: localhost
      PLATAFORMA_USUARIO: ${PLATAFORMA_USUARIO:?falta PLATAFORMA_USUARIO}
      PLATAFORMA_PASSWORD: ${PLATAFORMA_PASSWORD:?falta PLATAFORMA_PASSWORD}
      SEED_DEMO: "1"
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SITE_URL: http://localhost:${WEB_PORT}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    volumes:
      - uploads:/app/uploads

  client:
    build:
      context: ./client
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:${WEB_PORT:?falta WEB_PORT}:80"

volumes:
  pgdata:
  uploads:
