gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_vary on;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Cache de assets estáticos (JS, CSS, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: así cada deploy llega a todos al instante
    # (los assets con hash sí se cachean 1 año, ver bloque de arriba)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # React Router — todas las rutas apuntan al index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → servidor Express
    location /api {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Proxy imágenes subidas (^~ tiene prioridad sobre regex de assets estáticos)
    location ^~ /uploads {
        proxy_pass         http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
