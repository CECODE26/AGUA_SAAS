# Revisa cada push y pull request en busca de contraseñas, tokens y llaves.
# Si encuentra algo, el check falla y hay que sacarlo antes de mezclar.
name: Secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
      - name: Buscar secretos en los cambios
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGO="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGO="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGO="${{ github.sha }}~1..${{ github.sha }}"
          fi
          ./gitleaks git . --config .gitleaks.toml --log-opts="$RANGO" --redact --no-banner -v
