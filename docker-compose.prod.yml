# DB_PASSWORD (y opcionales VITE_*) vienen del archivo .env junto a este compose.
# Cada distribuidora entra por su dominio propio o por <slug>.PLATAFORMA_DOMINIO:
# apunta esos dominios (o un comodín *.PLATAFORMA_DOMINIO) a este servidor.

services:

  # ── Base de datos PostgreSQL ──────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       agua_piatua
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Servidor Express + Prisma ─────────────────────────────
  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/agua_piatua
    volumes:
      - uploads:/app/uploads

  # ── Cliente React (nginx) ─────────────────────────────────
  client:
    build:
      context: ./client
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_PLAY_STORE_URL: ${VITE_PLAY_STORE_URL:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
